# A solution is a collection of related projects that share same base configuration.
solution:
  created-for: CMSIS-Toolbox@2.12.0
  cdefault: # use CMSIS-Toolbox default Compiler options

  # Compilers that can be selected
  select-compiler:
    - compiler: AC6@6.20.1
    - compiler: GCC@15.2.1

  # List of miscellaneous tool-specific controls
  misc:
    - for-compiler: AC6 # Using DWARF 4 for better GDB compatibility
      C-CPP:
        - -gdwarf-4
      ASM:
        - -gdwarf-4
        - -Wa,armasm,--diag_suppress=A1950W
    - for-compiler: GCC
      C-CPP:
        - -ffunction-sections
        - -fdata-sections
        - -Wall
        - -Wextra
      Link:
        - -Wl,--gc-sections
        - -Wl,--print-memory-usage

  # List the packs that define the device and/or board.
  packs:
    - pack: Keil::STM32F1xx_DFP
    - pack: ARM::CMSIS

  # List different hardware targets that are used to deploy the solution.
  target-types:
    - type: STM32F103C8
      device: STM32F103C8
      target-set:
        - set:
          images:
            - project-context: navigation.Debug

  # List of different build configurations.
  build-types:
    - type: Debug
      debug: on
      optimize: none
      define:
        - DEBUG
    - type: Release
      debug: off
      misc:
        - for-compiler: AC6
          C-CPP:
            - -Os
        - for-compiler: GCC
          C-CPP:
            - -Os

    # List related projects.
  projects:
    - project: navigation/navigation.cproject.yml
  # Default compiler used when --toolchain is not specified.
  # NOTE: passing --toolchain GCC will print "redefinition" warnings � this is harmless.
  compiler: AC6@6.20.1
